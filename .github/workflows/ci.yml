name: Quality Gate & Supply Chain Pipeline

on:
  push:
    branches: [ main, developer ]
  pull_request:
    branches: [ main, developer ]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime & Tooling
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib streamlit pytest ruff mypy bandit

      - name: Gate 1 - Static Analysis & Formatter (Ruff)
        run: ruff check .

      - name: Gate 2 - Strict Type Check (Mypy)
        run: mypy logistic_regression.py evaluation.py

      - name: Gate 3 - Security & AST Vulnerability Scan (Bandit)
        run: bandit -r . -x ./tests

      - name: Gate 4 - Automated Test Suite (Pytest)
        run: pytest -v --disable-warnings
